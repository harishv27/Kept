name: Kept
options:
  bundleIdPrefix: com.harishv27
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  KeptCore:
    path: Packages/KeptCore
targets:
  Kept:
    type: application
    platform: iOS
    sources:
      - path: Kept
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: KeptCore
      - target: KeptWidget
    entitlements:
      path: Kept/Kept.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.harishv27.kept
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harishv27.kept
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Kept/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: Kept/Info.plist
      properties:
        CFBundleDisplayName: Kept
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
  KeptWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KeptWidget
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - package: KeptCore
    entitlements:
      path: KeptWidget/KeptWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.harishv27.kept
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harishv27.kept.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: KeptWidget/Info.plist
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: KeptWidget/Info.plist
      properties:
        CFBundleDisplayName: Kept
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Kept:
    build:
      targets:
        Kept: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: KeptCore/KeptCoreTests
    archive:
      config: Release
